version: '3.8'

services:
  zomboid-server:
    image: faudil/project-zomboid-server:latest
    container_name: zomboid-server
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "8766:8766/udp"
      - "8767:8767/udp"
      - "27015:27015/tcp"
    volumes:
      - zomboid_config:/home/steam/Zomboid
      - zomboid_server:/home/steam/pz-dedicated
    environment:
      # Server Configuration
      - SERVER_NAME=${ZOMBOID_SERVER_NAME:-SSF-HordeNight}
      - PUBLIC_NAME=${ZOMBOID_PUBLIC_NAME:-SSF - Horde Night}

      # Admin/Security
      - ADMIN_PASSWORD=${ZOMBOID_ADMIN_PASSWORD:-changeme}
      - RCON_PASSWORD=${ZOMBOID_RCON_PASSWORD}

      # Server Settings
      - MAX_PLAYERS=32
      - MAX_RAM=6144m

      # Mods
      - MOD_WORKSHOP_IDS=3773911887

      # Updates & Branch
      - UPDATE_ON_START=true
      - SERVER_BRANCH=

      # Backups
      - BACKUP_ENABLED=false

      # Discord Integration (optional)
      - DISCORD_WEBHOOK_URL=${ZOMBOID_DISCORD_WEBHOOK_URL:-}
    networks:
      - game_network
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 8G
        reservations:
          memory: 6G
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ProjectZomboid64 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    labels:
      - "com.docker.compose.project=games"
      - "com.docker.compose.service=zomboid"
    restart: unless-stopped

networks:
  game_network:
    driver: bridge

volumes:
  zomboid_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/ZomboidConfig
  zomboid_server:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/ZomboidDedicatedServer
