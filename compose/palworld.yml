version: '3.8'

services:
  palworld:
    image: thijsvanloef/palworld-server-docker:latest
    container_name: palworld-server
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "8211:8211/udp"
      - "27015:27015/udp"
      - "8212:8212/tcp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Vancouver
      - PORT=8211
      - QUERY_PORT=27015
      - PLAYERS=16
      - ENABLE_PERF_THREADING_ARGS=true
      - PALWORLD_ALLOW_NEGATIVE_DELTA_TIME=false
      - LOG_LEVEL=INFO
      - SERVER_NAME=SS Palworld
      - SERVER_DESCRIPTION=SS Palworld Server
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SERVER_PASSWORD=${SERVER_PASSWORD}
      - REST_API_ENABLED=true
      - REST_API_PORT=8212
      - COMMUNITY_SERVER=false
      - UPDATE_ON_BOOT=true
      - BACKUP_ENABLED=true
      - BACKUP_CRON_EXPRESSION=0 */6 * * *
      - PAL_EGG_DEFAULT_HATCHING_TIME=72
      - DELETE_OLD_BACKUPS=true
      - OLD_BACKUP_DAYS=7
      - AUTO_REBOOT_ENABLED=false
      - AUTO_REBOOT_CRON_EXPRESSION=0 5 * * *
      - AUTO_REBOOT_WARN_MINUTES=15
    volumes:
      - palworld_data:/palworld
    networks:
      - game_network
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 24G
        reservations:
          memory: 8G
    healthcheck:
      test: ["CMD", "nc", "-uz", "localhost", "8211"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      - "com.docker.compose.project=games"
      - "com.docker.compose.service=palworld"

networks:
  game_network:
    driver: bridge

volumes:
  palworld_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/palworld
