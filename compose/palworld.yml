version: "3.8"

services:
  palworld:
    image: ghcr.io/ripps818/docker-palworld-dedicated-server-wine:latest
    container_name: palworld-server

    restart: unless-stopped
    stop_grace_period: 60s

    ports:
      - "8211:8211/udp"
      - "27015:27015/udp"
      - "8212:8212/tcp"

    environment:
      # Docker
      TZ: America/Vancouver
      PUID: 1000
      PGID: 1000

      # Server
      SERVER_NAME: "SS Palworld"
      SERVER_DESCRIPTION: "SS Palworld Server"

      SERVER_PASSWORD: ${SERVER_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      PLAYERS: 16
      SERVER_SETTINGS_MODE: auto

      PORT: 8211
      QUERY_PORT: 27015

      REST_API_ENABLED: "true"
      REST_API_PORT: 8212

      COMMUNITY_SERVER: "false"

      # Keep automatic updates
      UPDATE_ON_BOOT: "true"

      # Workshop Mods (Steam Workshop)
      WORKSHOP_MOD_IDS: ${WORKSHOP_MOD_IDS}
      WORKSHOP_MOD_UPDATE_CRON: "0 */6 * * *"
      WORKSHOP_MODS_DEBUG: "false"

      # Steam Authentication (required for paid Workshop content)
      STEAM_USERNAME: ${STEAM_USERNAME}
      STEAM_PASSWORD: ${STEAM_PASSWORD}

      # UE4SS Experimental Framework
      INSTALL_UE4SS_EXPERIMENTAL: "true"

      # Client Mods
      ALLOW_CLIENT_MOD: "true"

    volumes:
      - /data/palworld:/palworld
      - ./steam_cache:/home/steam/Steam/

    networks:
      - game_network

    healthcheck:
      test: ["CMD", "nc", "-uz", "localhost", "8211"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    labels:
      - "com.docker.compose.project=games"
      - "com.docker.compose.service=palworld"

networks:
  game_network:
    driver: bridge